<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yash — Senior Full-Stack Engineer & UI Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
      <!-- Global runtime error overlay (shows uncaught errors even if React fails) -->
      <script>
        (function () {
          const css = `#global-error { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 2147483647; background: rgba(17,17,17,0.95); color: #fff; padding: 16px; border-radius: 8px; font-family: system-ui, sans-serif; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-height: 60vh; overflow: auto; } #global-error pre { white-space: pre-wrap; color: #ffd; } #global-error button { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 6px 10px; border-radius: 6px; float: right; cursor: pointer; }
          `;
          const style = document.createElement('style');
          style.textContent = css;
          document.head.appendChild(style);

          const el = document.createElement('div');
          el.id = 'global-error';
          el.style.display = 'none';
          el.innerHTML = '<button id="global-error-close">Close</button><strong>Runtime Error</strong><pre id="global-error-msg"></pre>';
          document.body.appendChild(el);

          document.getElementById('global-error-close').addEventListener('click', () => { el.style.display = 'none'; });

          function showError(msg) {
            const pre = document.getElementById('global-error-msg');
            pre.textContent = msg;
            el.style.display = 'block';
          }

          window.addEventListener('error', function (evt) {
            try { showError(evt.message + '\n' + (evt.filename || '') + ':' + (evt.lineno || '') + '\n' + (evt.error && evt.error.stack ? evt.error.stack : '')); } catch (e) { /* ignore */ }
            console.error('Global error:', evt.error || evt.message);
          });

          window.addEventListener('unhandledrejection', function (evt) {
            try { showError('Unhandled Rejection:\n' + (evt.reason && (evt.reason.stack || evt.reason.toString()))); } catch (e) { /* ignore */ }
            console.error('Unhandled rejection:', evt.reason);
          });
        })();
      </script>

      <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
